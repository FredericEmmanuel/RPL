name: StudyBuddy CI/CD P11

on:
  push:
    branches: [v1.0_dev]
  pull_request:
    branches: [v1.0_dev, v1.1]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Run the isolated, intentional failed-gate demonstration"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (200 unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Demonstrate failed gate
        if: inputs.simulate_failure == true
        run: npm run test:failed-gate-demo --workspace @studybuddy/api

  build:
    name: Build monorepo
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy preview to Vercel
    needs: [test, build]
    if: github.event_name != 'workflow_dispatch' || inputs.simulate_failure != true
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require Vercel project credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Set VERCEL_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Set VERCEL_ORG_ID in GitHub Actions secrets."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Set VERCEL_PROJECT_ID in GitHub Actions secrets."; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull preview environment and build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel build --target=preview --token="$VERCEL_TOKEN"
      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --prebuilt --target=preview --yes --token="$VERCEL_TOKEN"
